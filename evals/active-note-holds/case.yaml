schema_version: "1.0"
name: active-note-holds
description: An active note is followed in the resume; a proposed one the candidate never activated is not.
tags: [notes]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Skill
    - "Bash(uv run:*)"
    - mcp__plugin_callback_callback__notes_list
    - mcp__plugin_callback_callback__notes_propose
  prompt: |
    Tailor my resume to the Acme Robotics posting in posting.md; my confirmed facts
    are in my-facts.yaml. Make the bullets punchy, with strong leadership verbs up
    front. Save it as resume.yaml here.
graders:
  - type: regex
    name: active-note-followed
    target: {source: file, path: resume.yaml}
    pattern: 'spearhead'
    flags: i
    match: not_contains
    weight: 2
  - type: regex
    name: proposed-note-not-followed
    target: {source: file, path: resume.yaml}
    pattern: 'title:\s*["'']?summary'
    flags: i
    match: not_contains
  - type: file_exists
    name: wrote-a-resume
    path: resume.yaml
runs: 3
