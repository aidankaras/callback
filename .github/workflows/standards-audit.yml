name: Standards audit

# Reads the whole repository against the properties this project claims for
# itself (see the prompt below) and opens a pull request with the findings
# in reports/standards-audit.md. It changes nothing else: an unattended fix
# to a design decision is exactly the confident, plausible, wrong change the
# gates in this project exist to catch, so the audit is instructed to report
# only, never to edit core/, tests/, docs/ or its own workflow.
#
# Triggers are schedule and workflow_dispatch only -- never an event carrying
# attacker-influenced content (issue_comment, pull_request_target, etc) -- and
# nothing from github.event.* is interpolated into the prompt or any shell
# command below. That is what keeps the injection surface at zero rather than
# merely small.
#
# The day-of-week field is left as `*` deliberately. crontab(5) documents that
# naming both day-of-month and day-of-week restricts the schedule to the
# union (OR) of the two, not their intersection -- so day-of-month "1,15"
# combined with a restricted day-of-week would fire far more often than the
# 1st/15th intended.
#
# The PR below is opened with the default GITHUB_TOKEN, which GitHub
# deliberately does not let trigger other workflows (this stops an
# unattended workflow from recursively spawning more workflow runs). CI and
# any review automation configured on pull_request will NOT run against this
# PR automatically; a human has to open it (push an empty commit, or use
# `gh pr checks --watch` / re-run) to get those signals before merging.

on:
  schedule:
    - cron: "0 9 1,15 * *"
  workflow_dispatch: {}

permissions:
  # Read-only on the repository: the audit writes one report, which leaves as a
  # run artifact rather than a commit, and it may run project code (`uv run`),
  # so it holds no token that could push or open anything.
  contents: read
  # The action authenticates by exchanging a GitHub OIDC token; without this
  # it fails before running, "Could not fetch an OIDC token".
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          # Full history: the audit checks whether files keep being amended for
          # the same defect class, which a shallow clone cannot show.
          fetch-depth: 0

      # The report's directory exists before the audit runs, so its single
      # permitted Write is to a path, never a directory it must create.
      - name: Prepare the report directory
        run: mkdir -p reports

      # Property 4 asks whether each check can fail, which is answered by
      # running the suite, not by reading it: the audit may call `uv run`.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Install the project
        run: uv sync --locked

      - name: Run the audit
        uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de  # v1
        env:
          # Keep subagents in the foreground. The review and audit both start
          # agents in the background and end their turn to wait for them, and
          # in an unattended run ending the turn ends the run: reviews finished
          # in three turns with no comments, and one audit wrote no report.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          # The OAuth token, not an API key: this project runs on a subscription
          # and a metered key would bill every scheduled run. The repository has
          # only CLAUDE_CODE_OAUTH_TOKEN set, so asking for ANTHROPIC_API_KEY
          # also meant this job could never start.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Write is allowed without a path: a path-scoped Write rule refused the
          # report twice, and what reaches the repository is decided by the pull
          # request step, which commits reports/standards-audit.md and nothing
          # else, from a runner that is then discarded. Subagents are disallowed:
          # one run delegated its reading to background agents and ended its turn
          # waiting for them, which in an unattended run ends the audit unwritten.
          # Printed so a failed run says why; the repository is private and
          # the audit reads nothing a contributor cannot already see.
          show_full_output: true
          claude_args: |
            --max-turns 160
            --allowedTools "Read,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(find:*),Bash(cat:*),Bash(ls:*),Bash(wc:*),Bash(head:*),Bash(tail:*),Bash(sed -n:*),Bash(grep:*),Bash(uv run pytest:*),Bash(uv run python:*),Bash(uv run pyright:*),Bash(uv run ruff:*),Write"
            --disallowedTools "Agent,Task"
          prompt: |
            You are auditing this repository, `callback`, against the properties
            it claims for itself. This is a read-only audit: do not edit, fix, or
            refactor anything. The only file you may write is
            reports/standards-audit.md. An unattended fix to a design decision is
            the exact failure mode this project exists to catch in generated text,
            and it is no more acceptable coming from you.

            Read the whole repository -- core/, tests/, docs/, README.md,
            pyproject.toml, .github/workflows/ -- and evaluate it against these
            claimed properties. Each is stated with the kind of defect that has
            actually occurred in this codebase before, as a guide to the class of
            problem to look for; it is background, not a claim that the defect is
            still present today, so verify current behaviour rather than assuming
            the seed still applies.

            1. No fabrication enforced in code: a claim without user-supplied
               provenance must not be able to become output. (Previously:
               `Provenance` was mutable, so one attribute assignment could flip an
               unconfirmed imported fact into a confirmed one.)
            2. Grounding as derivability, not containment: a derived figure must be
               recomputed, not merely matched against text; a plausible
               interpretation must not be applied without context. (Previously: any
               1900-2100 integer inside a date hull was read as a year, so "Cut the
               $2020 licensing cost" passed grounding with no findings.)
            3. Declared error boundaries hold: each module raises only the
               exception type(s) it declares at its boundary. (Previously,
               `store.py` leaked exception types it did not declare.)
            4. Checks that can actually fail: for every gate, assertion, and metric
               in the test suite, ask whether a plausible mutation of the code
               under test would make it fail. (Previously, several checks in this
               project could not fail no matter what the code under test did,
               including a test that asserted a finding-kind slice while leaving
               the headline verdict unchecked.)
            5. Documentation does not outrun code: prose must not describe, in the
               present tense, behaviour that is not built. (Previously, the README
               claimed gates that had no implementation.)
            6. Design and economy: flag abstractions earning nothing, duplication
               that should consolidate (and the inverse: over-consolidation that
               should split), and use `git log` on files under `core/` to find any
               that have been amended more than twice for what looks like the same
               class of defect -- a fix that recurs in one file is a design
               problem, not a sequence of unrelated bugs.
            7. Dependency reality: every third-party module imported by shipped
               code under `core/` must resolve from the declared non-optional
               dependencies in `pyproject.toml`, not from the development
               environment. Check the import list against
               `project.dependencies` specifically -- `[dependency-groups]`
               and any optional extra do not count, because a consumer
               installing the package does not get them. This is invisible to
               CI by construction: CI installs the dev group, so a module that
               only an extra provides imports fine there and fails on a user's
               machine. State the import list you checked and where each name
               is declared.
            8. Prose by audience: identify any section that must orient a reader
               unfamiliar with the code versus one written for a reader who will
               check the arithmetic or the exception types by hand, and flag any
               passage whose register fits neither -- too vague to verify, or too
               dense to orient.

            Do every piece of reading yourself: do not start subagents or
            background tasks, and do not end your turn to wait for anything.
            Write the report with the Write tool before your final message --
            an audit that ends without writing reports/standards-audit.md is
            lost, however complete its reading was. The run has a fixed turn
            budget and ends without warning when it is spent, so write the
            report early and rewrite it as you go: after every two properties,
            Write the whole report so far, with the properties not yet examined
            marked "not yet examined". A run cut short then still leaves every
            finding it reached.

            To run code, use `uv run pytest ...` or `uv run python -c "..."`
            (the project is installed). Plain `python3`, shell variables and
            commands joined with `&&` or `;` are refused by the permission
            rules; run one command per call.

            Write your findings to reports/standards-audit.md, organized by these
            eight properties. For each one, either cite the specific file, line
            range, or test name that demonstrates a finding, or say plainly that
            you found nothing demonstrable in that category -- do not manufacture
            a finding to look thorough; a report that invents problems trains its
            reader to stop trusting the next one. Do not include a finding you
            cannot point at in the actual current source.

      - name: Fail if the audit produced no report
        run: |
          # A run that writes nothing must not go green. The pull-request action
          # below opens no PR when it finds no change, so without this check a
          # silently empty audit is indistinguishable from an audit that found
          # nothing worth saying -- and both look like success.
          #
          # `git status --porcelain` rather than `git diff`: this file is untracked
          # until the first audit commits it, and `git diff` does not report
          # untracked files, so it would answer "no change" no matter what was
          # written.
          report=reports/standards-audit.md
          test -f "$report" || { echo "::error::$report was not written"; exit 1; }
          bytes=$(wc -c < "$report")
          echo "report is $bytes bytes"
          echo "tree state:"; git status --porcelain
          if [ "$bytes" -lt 500 ]; then
            echo "::error::$report is $bytes bytes, too small to be a real audit"
            exit 1
          fi
          for n in 1 2 3 4 5 6 7 8; do
            grep -q "^#\+ *$n\.\|^$n\." "$report" || \
              echo "::warning::no section found for claimed property $n"
          done

      # The report stays with the run and is not committed. It is a snapshot of
      # one commit, so a copy in the tree goes stale as the code moves and the
      # repository ends up asserting findings that may already be fixed; the
      # artifact keeps it readable without that claim. An earlier version opened
      # a pull request per run, which also could not work from a feature branch,
      # whose workflow-file changes the default token may not push.
      - name: Keep the report with the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: standards-audit
          path: reports/standards-audit.md
