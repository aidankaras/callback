name: Code Review

# Reviews every pull request automatically. The per-change reviews during
# development are dispatched by hand, which means they stop the moment nobody
# is dispatching them; this one runs on the pull request itself and keeps
# running afterwards.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:

# One review per pull request at a time: a new push cancels the review of the
# commit it replaces. Each push to a large pull request otherwise started
# another full review, several running at once on superseded code.
concurrency:
  group: code-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@cfc3eb22bfed5c26ef66e3223c982af27e4524de  # v1
        env:
          # Keep subagents in the foreground. The review and audit both start
          # agents in the background and end their turn to wait for them, and
          # in an unattended run ending the turn ends the run: reviews finished
          # in three turns with no comments, and one audit wrote no report.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          # OAuth token rather than a metered API key: this project runs on a
          # subscription, and a pull-request trigger fires far more often than
          # a schedule does.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Printed so a run that ends in a few turns shows why; the repository
          # is private.
          show_full_output: true
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Inline comments only. A reviewer that can write to the tree is no
          # longer a reviewer, and this repository's own guidance says an
          # unattended fix to a design decision is the failure mode it exists
          # to catch.
          # The inline-comment tool, plus the read-only GitHub queries the review
          # plugin makes. Without them it stops mid-review to ask permission, and
          # an unattended run that ends on a question still reports success: one
          # review ended after 7 turns asking to read the pull request's comments.
          #
          # Reads go through `gh pr view` and `gh pr diff`, which cannot write;
          # raw `gh api` is not allowed at all. An earlier allow rule of the form
          # `gh api repos/*/.../comments:*` never matched (a `*` inside a
          # `prefix:*` rule is literal), and the glob form that does match also
          # admits writes such as `-X POST`, or `-iF body=...`, which slips past
          # any deny list of flag substrings. Measured with a headless
          # `claude -p` run before this landed.
          #
          # wc, head, tail and grep let a large diff be read through a pipe. The
          # run cannot write files, shell redirection included, so the appended
          # prompt says so up front: one review of a 130 KB diff made 63 refused
          # calls, mostly attempts to save the diff to a file.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(wc:*),Bash(head:*),Bash(tail:*),Bash(grep:*)"
            --append-system-prompt "This run cannot write files: shell redirection, mkdir and file-writing tools are refused, and so are commands using exit-status variables or command substitution. Read the diff through pipes instead, for example gh pr diff N | grep -n '^diff --git' to find each file, then gh pr diff N | head -n END | tail -n COUNT to read a range, or read changed files from the checkout. For comments, commits and files use gh pr view N --comments or gh pr view N --json comments,reviews,commits,files; gh api is refused. The review instructions are already loaded, so do not invoke them again as a skill. Pass these constraints to any agent you start."
