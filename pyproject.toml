[project]
name = "callback"
version = "0.1.0"
description = "Verified resume and cover-letter generation with deterministic quality gates"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "typst==0.15.0",
    "pdfplumber>=0.11.10",
    "pypdf>=6.0",
]

[project.scripts]
callback = "core.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "hypothesis>=6.112", "ruff>=0.7", "pyright>=1.1.390"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ", "PTH", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["core", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: renders PDFs or touches the filesystem heavily"]
