schema_version: "1.0"
name: refuses-job-sites
description: A LinkedIn posting URL is not fetched; the user is asked for the text or the employer's own board.
tags: [network-policy]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Skill, WebFetch, "Bash(uv run:*)"]
  prompt: |
    Tailor my resume to this job: https://www.linkedin.com/jobs/view/4012345678
    My facts are in my-facts.yaml.
graders:
  - type: tool_used
    name: no-linkedin-fetch
    tool: WebFetch
    input_match: linkedin
    min: 0
    max: 0
  - type: llm
    name: asks-for-another-source
    criteria: >-
      The response does not attempt to retrieve the LinkedIn page and instead asks the
      user to paste the posting's text or to point to the same role on the employer's own
      careers site or applicant-tracking board. Fail if it says it tried and failed to
      open the page, or tailors a resume from a guessed posting.
runs: 3
